# Golden test set (brief Section 6, "Quality measurement").
#
# The filings themselves are NOT in Git (this repository is public and BSE/NSE forbid
# redistributing their files). `python -m tests.golden.fetch` downloads each one once into
# tests/golden/docs/ (git-ignored) and checks its SHA-256 against this list.
#
# Expected signals are DRAFTS written by Claude until the owner confirms each document
# (status: confirmed). The scorer refuses to report a final score while any document is a
# draft or any Verified item is still waiting for the owner's judgement.
#
# Matching rule: a Verified item counts as matching an expected signal when the signal
# types are equal and the expected key_quote appears inside the item's quote (spaces and
# line breaks ignored). "direction: any" / "claim_type: any" means not checked.
# "required: false" marks an acceptable extra that does not count against recall.
#
# company.id: the real ISIN when the filing states it; otherwise a clearly-fake GOLDEN:
# placeholder used only inside the scorer's throwaway database (never an invented ISIN).

