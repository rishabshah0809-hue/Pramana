[theme]
base = "dark"
primaryColor = "#4F8BF9"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#161B22"
textColor = "#E6EDF3"
font = "sans serif"

[browser]
# Don't send usage statistics to Streamlit
gatherUsageStats = false

[client]
# Hide Streamlit's developer error details; the app shows plain-English errors
showErrorDetails = "none"
toolbarMode = "minimal"
