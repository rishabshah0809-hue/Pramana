# ---------------------------------------------------------------------------
# Mosaic India — settings
#
# Keys and passwords do NOT go here. They go in ".env".
# Empty slots ("" or []) are filled in by later milestones.
# ---------------------------------------------------------------------------

app:
  timezone: Asia/Kolkata
  dashboard_port: 8501
  log_level: INFO

# Your watchlist is managed on the Watchlist page in the app (stored in the database).
watchlist:
  max_companies: 50

# Market hours used by the scheduler (IST), from the product brief
market_hours:
  open: "09:15"
  close: "15:30"

# NSE trading holidays as dates, e.g. - 2026-10-02
# Copy them from NSE's yearly holiday circular. Leave empty if unsure: the app then
# only skips weekends, and on a holiday prices may show "stale" until the next session.
market_holidays: []

# How old data may get before it is marked stale
freshness:
  intraday_price_minutes: 45        # during market hours (Yahoo is ~15 min delayed)
  company_list_days: 35             # re-download NSE's list about once a month
  filings_days: 3                   # newest feed item older than this = "stale" content
  shareholding_days: 30             # shareholding is quarterly, so its feed is quieter

# How often each data source is fetched (filled in as each adapter is built)
schedules:
  prices_live: ""                  # Angel One — added when your API keys are ready
  prices_delayed:
    every_minutes: 15               # during market hours
    after_close: "15:45"            # one more fetch for the closing prices
  # Official exchange RSS feeds (M2). NSE's feeds keep only 10-20 items and ask to be
  # re-checked every 5 minutes, so they are checked often on busy weekday hours.
  nse_feeds:
    busy_every_minutes: 5
    busy_days: mon-fri
    busy_hours: "08:00-22:00"       # IST, start inclusive, end exclusive
    quiet_every_minutes: 30         # nights and weekends
  bse_feed:
    market_every_minutes: 15        # during market hours
    other_every_minutes: 60         # otherwise
  bulk_block_deals:
    after_close: "18:30"            # IST, weekdays; NSE posts the day's files after the close
  fii_dii_activity: ""
  xbrl_results: ""
  amfi_portfolios: ""
  macro: ""
  monthly_business_updates: ""
  credit_ratings: ""
  news_rss: ""

# Free-tier request limits per source (filled in as each source is verified)
rate_limits:
  yahoo_prices:
    max_attempts: 3                 # retries with waits of 2s, 4s, 8s
  exchanges:                        # NSE and BSE (feeds, attachments, daily files)
    min_seconds_between_requests: 1.0   # per website; the brief allows "a few per second" at most
    max_attempts: 3                 # retries with waits of 2s, 4s, 8s
    timeout_seconds: 30
    attachments_per_run: 25         # filing files downloaded per check (watchlist companies only)
    max_file_mb: 40                 # larger files are skipped and reported
    user_agent: "MosaicIndia/0.2 (personal research tool; single user; polite, rate-limited)"

# Cross-source number checks (brief 14.6): differences larger than this are "conflicts"
conflicts:
  shareholding_percent_points: "0.01"

# AI models (M3). Names, temperatures and limits live here, never in code, because
# free-tier models change. Checked live on 26 Sep 2026 (see DATA_SOURCES.md).
ai:
  prompts:                        # active prompt versions (files in app/llm/prompts/)
    extract: v2                   # v2 (26 Sep 2026): adds the financial_results type
    crosscheck: v1
    summarize: v1
  tasks:
    extraction:                   # step b: Groq first, Gemini if Groq is unavailable
      primary:  {provider: groq,   model: openai/gpt-oss-120b, temperature: 0}
      fallback: {provider: gemini, model: gemini-3.8-flash, temperature: 1.0, thinking_level: low}
    crosscheck:                   # step d: must be a different provider from the extractor
      primary:  {provider: gemini, model: gemini-3.1-flash-lite, temperature: 1.0}
      fallback: {provider: groq,   model: openai/gpt-oss-20b, temperature: 0}
    summary:                      # step f
      primary:  {provider: gemini, model: gemini-3.8-flash, temperature: 1.0, thinking_level: low}
      fallback: {provider: groq,   model: openai/gpt-oss-120b, temperature: 0}
  # Gemini 3 models: Google recommends temperature 1.0 (owner's decision, 26 Sep 2026).
  # Groq stays at 0. Code still has the final say on everything saved.

  # Free-tier limits per model. rpm/rpd = requests per minute/day, tpm/tpd = tokens.
  # Blank = no limit published. The app keeps a safety margin below each limit.
  limits:
    openai/gpt-oss-120b: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, day: rolling}
    openai/gpt-oss-20b:  {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, day: rolling}
    # Gemini free limits as shown in the owner's AI Studio on 26 Sep 2026 (per project).
    gemini-3.8-flash:      {rpm: 5,  rpd: 20, tpm: 250000, tpd: "", day: pacific_midnight}
    gemini-3.1-flash-lite: {rpm: 15, rpd: 500, tpm: 250000, tpd: "", day: pacific_midnight}
  safety_margin: 0.9              # use at most 90% of each limit

  processing:
    every_minutes: 10             # how often the background queue runs
    max_calls_per_run: 40         # stops early if any limit is reached
    chunk_chars: 3000             # a passage never crosses a page and is at most this long
    max_output_tokens: 2000
    # Filing types sent for AI extraction, in priority order (earlier = sooner).
    categories: [transcript, results, presentation, order, rating, board_meeting, insider,
                 sast, pledge, shareholding, other, annual_report]
    summary_auto: [transcript, presentation]   # summarised automatically; others on request
    summary_max_chars: 120000     # longer documents are summarised from their first part only

  # Code-built signals from structured data (no AI).
  structured_signals:
    shareholding_change_points: "0.50"   # promoter / FII / DII change that makes a signal
    deals_watchlist_only: true

  embeddings:
    local_model: ""                # M5
