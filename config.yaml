# ---------------------------------------------------------------------------
# Mosaic India — settings
#
# Keys and passwords do NOT go here. They go in ".env".
# Empty slots ("" or []) are filled in by later milestones.
# ---------------------------------------------------------------------------

app:
  timezone: Asia/Kolkata
  dashboard_port: 8501
  log_level: INFO

# Companies you track (filled in M1, from the app's watchlist screen)
watchlist: []

# Market hours used by the scheduler (IST), from the product brief
market_hours:
  open: "09:15"
  close: "15:30"

# How often each data source is fetched (filled in as each adapter is built)
schedules:
  prices_live: ""
  prices_delayed: ""
  announcements: ""
  shareholding: ""
  insider_trades: ""
  bulk_block_deals: ""
  fii_dii_activity: ""
  xbrl_results: ""
  amfi_portfolios: ""
  macro: ""
  monthly_business_updates: ""
  credit_ratings: ""
  news_rss: ""

# Free-tier request limits per source (filled in as each source is verified)
rate_limits: {}

# AI models. Names live here, never in code, because free-tier models change.
ai:
  groq:
    extraction_model: ""
    verification_fallback_model: ""
    temperature: 0
  gemini:
    summary_model: ""
    verification_model: ""
    qa_model: ""
    embedding_fallback_model: ""
    temperature: 0
  embeddings:
    local_model: ""
